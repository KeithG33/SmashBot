[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shinebot"
version = "0.1.0"
description = "ShineBot: a PyTorch replication of slippi-ai (SSBM imitation learning + RL)"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "numpy",
  "pyarrow",
  "wandb",
  "tyro",
  "dm-tree",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["shinebot*"]

[tool.ruff]
line-length = 100
target-version = "py312"
