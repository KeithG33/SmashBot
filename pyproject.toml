[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smashbot"
version = "0.1.0"
description = "SmashBot: a PyTorch replication of slippi-ai (SSBM imitation learning + RL)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "torch",
  "numpy",
  "pyarrow",
  "wandb",
  "tyro",
  "dm-tree",
  "tqdm",
  "melee",   # libmelee: Dolphin play and the replay parser
  # slippi_ai is vendored, not on PyPI: pip install -e vendor/slippi-ai
  # (it brings peppi-py); RL also needs the vendor/melee-sim-light submodule
  # (git submodule update --init; private repo) built (docs/sim-backend.md)
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["huggingface_hub"]   # scripts/fetch_dataset.py, upload_dataset.py

[tool.setuptools.packages.find]
include = ["smashbot*"]

[tool.ruff]
line-length = 100
target-version = "py312"
